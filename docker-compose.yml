services:
  # Cadena local de demostración. Bórrala si apuntas a Sepolia u otra red.
  cadena:
    build: .
    command: npx hardhat node --hostname 0.0.0.0
    expose:
      - "8545"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    command: node servidor/index.js
    environment:
      PORT: "3000"
      RPC_URL: http://cadena:8545
      COMISION_BPS: "350"
      # CONTRATO_DIRECCION: "0x..."   # opcional: reutiliza uno ya desplegado
      # CLAVE_ARBITRO / CLAVE_COMPRADOR / CLAVE_VENDEDOR  # solo para redes reales
    ports:
      - "3000:3000"
    depends_on:
      cadena:
        condition: service_healthy
    restart: unless-stopped
